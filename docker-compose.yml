services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hybrid-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: hybrid_rag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d hybrid_rag"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: hybrid-rag-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    container_name: hybrid-rag-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull llama3
        ollama pull nomic-embed-text
        echo "Ollama models ready."
    restart: "no"

  api:
    build: .
    container_name: hybrid-rag-api
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEBUG: "true"
      API_KEYS: ${API_KEYS:-dev-secret-key-change-me}
      DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/hybrid_rag
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RERANK_TOP_K: ${RERANK_TOP_K:-3}
      MIN_CONFIDENCE_THRESHOLD: ${MIN_CONFIDENCE_THRESHOLD:-0.35}
      HYBRID_CANDIDATE_LIMIT: ${HYBRID_CANDIDATE_LIMIT:-20}
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
